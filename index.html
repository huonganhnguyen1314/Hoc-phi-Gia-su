<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học Phí Gia Sư</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0c;
    --surface: #1a1814;
    --card: #211f1a;
    --border: #2e2b24;
    --accent: #e8c87a;
    --accent2: #b5936a;
    --text: #f0ead8;
    --muted: #7a7264;
    --danger: #c0614a;
    --success: #6aaa7a;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 0 0 80px;
  }

  header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.45rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--accent);
  }

  header span {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 24px 8px;
  }

  .month-nav button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 34px; height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    transition: background 0.15s;
    display: flex; align-items: center; justify-content: center;
  }

  .month-nav button:hover { background: var(--border); }

  .month-nav .month-label {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--accent);
    flex: 1;
  }

  .tabs {
    display: flex;
    gap: 8px;
    padding: 12px 24px 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    padding: 8px 18px;
    border-radius: 40px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }

  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1814;
    font-weight: 500;
  }

  .tab:hover:not(.active) { border-color: var(--accent2); color: var(--text); }

  .summary-bar {
    margin: 16px 24px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
  }

  .summary-item label {
    display: block;
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }

  .summary-item .val {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--accent);
  }

  .summary-item .val.green { color: var(--success); }

  .calendar-card {
    margin: 18px 24px 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    animation: fadeUp 0.25s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .cal-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .cal-header .student-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 600;
  }

  .cal-header .price-tag {
    font-size: 0.78rem;
    color: var(--accent2);
    background: rgba(232,200,122,0.08);
    border: 1px solid rgba(232,200,122,0.18);
    padding: 3px 10px;
    border-radius: 20px;
  }

  .day-labels {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 10px 12px 4px;
    gap: 4px;
  }

  .day-labels span {
    text-align: center;
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 4px 12px 14px;
    gap: 5px;
  }

  .cal-day {
    aspect-ratio: 1;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all 0.14s;
    background: var(--surface);
    position: relative;
    min-height: 38px;
  }

  .cal-day.empty { background: transparent; cursor: default; }
  .cal-day .dn { font-size: 0.8rem; font-weight: 400; color: var(--muted); }
  .cal-day.today .dn { color: var(--accent); font-weight: 500; }

  .cal-day.marked {
    background: rgba(232,200,122,0.12);
    border-color: var(--accent);
  }

  .cal-day.marked .dn { color: var(--accent); font-weight: 500; }

  .cal-day .hrs {
    font-size: 0.62rem;
    color: var(--accent2);
    margin-top: 1px;
    font-weight: 500;
  }

  .cal-day:not(.empty):hover {
    border-color: var(--accent2);
    transform: scale(1.04);
  }

  .cal-total {
    padding: 10px 20px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .cal-total span { font-size: 0.8rem; color: var(--muted); }
  .cal-total strong {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    color: var(--success);
  }

  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    padding: 24px 24px 40px;
    width: 100%;
    max-width: 480px;
    animation: slideUp 0.2s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }

  .modal h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    margin-bottom: 18px;
    color: var(--accent);
  }

  .modal label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }

  .modal input[type=number],
  .modal input[type=text] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    padding: 11px 14px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.14s;
  }

  .modal input:focus { border-color: var(--accent2); }

  .hour-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .hour-btn {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.14s;
  }

  .hour-btn:hover, .hour-btn.sel {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1814;
    font-weight: 500;
  }

  .modal-actions { display: flex; gap: 10px; }

  .btn-save {
    flex: 1;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #1a1814;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 13px;
    cursor: pointer;
    transition: opacity 0.14s;
  }

  .btn-save:hover { opacity: 0.85; }

  .btn-clear {
    background: transparent;
    border: 1px solid var(--danger);
    border-radius: 10px;
    color: var(--danger);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    padding: 13px 18px;
    cursor: pointer;
    transition: background 0.14s;
  }

  .btn-clear:hover { background: rgba(192,97,74,0.1); }

  .btn-cancel {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    padding: 13px 18px;
    cursor: pointer;
  }

  .fab {
    position: fixed;
    bottom: 28px; right: 24px;
    width: 54px; height: 54px;
    background: var(--accent);
    border: none;
    border-radius: 50%;
    font-size: 1.5rem;
    color: #1a1814;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 24px rgba(232,200,122,0.25);
    transition: transform 0.14s;
    z-index: 150;
  }
  .fab:hover { transform: scale(1.08); }

  .student-list-manage { margin-bottom: 14px; }

  .student-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }

  .student-row .sname { flex: 1; font-size: 0.9rem; }
  .student-row .sprice { font-size: 0.8rem; color: var(--accent2); }

  .btn-del-student {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 1rem;
    cursor: pointer;
    padding: 4px;
    opacity: 0.6;
    transition: opacity 0.14s;
  }
  .btn-del-student:hover { opacity: 1; }

  .add-student-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .add-student-row input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    padding: 9px 12px;
    outline: none;
  }

  .add-student-row input:focus { border-color: var(--accent2); }
  .add-student-row input.w2 { width: 110px; }
  .add-student-row input.w1 { flex: 1; }

  .btn-add-s {
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #1a1814;
    padding: 9px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    font-size: 0.9rem;
  }

  .dot-today {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent);
    position: absolute;
    bottom: 5px;
  }
</style>
</head>
<body>

<header>
  <h1>✦ Học Phí Gia Sư</h1>
  <span id="today-display"></span>
</header>

<div class="month-nav">
  <button onclick="changeMonth(-1)">‹</button>
  <div class="month-label" id="month-label"></div>
  <button onclick="changeMonth(1)">›</button>
  <button onclick="openManage()" style="margin-left:auto;font-size:0.85rem;width:auto;padding:0 14px;border-radius:20px;">+ HS</button>
</div>

<div class="tabs" id="tabs"></div>

<div class="summary-bar" id="summary-bar">
  <div class="summary-item">
    <label>Tổng buổi</label>
    <div class="val" id="sum-sessions">0</div>
  </div>
  <div class="summary-item">
    <label>Tổng giờ</label>
    <div class="val" id="sum-hours">0h</div>
  </div>
  <div class="summary-item">
    <label>Học phí tháng</label>
    <div class="val green" id="sum-fee">0đ</div>
  </div>
</div>

<div id="calendar-area"></div>

<div class="overlay" id="session-overlay">
  <div class="modal">
    <h3 id="modal-title">Buổi học</h3>
    <label>Số giờ học</label>
    <div class="hour-btns" id="hour-btns">
      <button class="hour-btn" onclick="selectHour(1)">1h</button>
      <button class="hour-btn" onclick="selectHour(1.5)">1.5h</button>
      <button class="hour-btn" onclick="selectHour(2)">2h</button>
      <button class="hour-btn" onclick="selectHour(2.5)">2.5h</button>
      <button class="hour-btn" onclick="selectHour(3)">3h</button>
    </div>
    <label>Hoặc nhập số giờ khác</label>
    <input type="number" id="hour-input" placeholder="VD: 1.5" step="0.5" min="0.5" max="8">
    <div class="modal-actions">
      <button class="btn-save" onclick="saveSession()">Lưu buổi học</button>
      <button class="btn-clear" onclick="clearSession()">Xóa</button>
      <button class="btn-cancel" onclick="closeModal()">Hủy</button>
    </div>
  </div>
</div>

<div class="overlay" id="manage-overlay">
  <div class="modal">
    <h3>Quản lý học sinh</h3>
    <div class="student-list-manage" id="student-list-manage"></div>
    <div class="add-student-row">
      <input type="text" class="w1" id="new-name" placeholder="Tên học sinh">
      <input type="number" class="w2" id="new-price" placeholder="Giá/h (đ)">
      <button class="btn-add-s" onclick="addStudent()">Thêm</button>
    </div>
    <br>
    <button class="btn-cancel" style="width:100%;margin-top:4px" onclick="closeManage()">Xong</button>
  </div>
</div>

<button class="fab" onclick="openManage()">⊕</button>

<script>
const STORAGE_KEY = 'giasuData_v2';

function loadData() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { students: [], sessions: {} };
  } catch { return { students: [], sessions: {} }; }
}

function saveData(d) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
}

let data = loadData();

if (data.students.length === 0) {
  data.students = [
    { id: 's1', name: 'An', pricePerHour: 80000 },
    { id: 's2', name: 'Bình', pricePerHour: 100000 },
  ];
  saveData(data);
}

const today = new Date();
let curYear = today.getFullYear();
let curMonth = today.getMonth();
let activeStudentId = data.students[0]?.id || null;
let modalStudentId = null;
let modalDay = null;
let selectedHour = null;

function sessionKey(studentId, year, month, day) {
  return ${studentId}_${year}_${month+1}_${day};
}

function fmt(n) {
  return n.toLocaleString('vi-VN') + 'đ';
}

function render() {
  document.getElementById('month-label').textContent = Tháng ${curMonth+1} / ${curYear};
  const d = today;
  document.getElementById('today-display').textContent = ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()};

  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  data.students.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (s.id === activeStudentId ? ' active' : '');
    btn.textContent = s.name;
    btn.onclick = () => { activeStudentId = s.id; render(); };
    tabs.appendChild(btn);
  });

  const area = document.getElementById('calendar-area');
  area.innerHTML = '';

  if (data.students.length === 0) {
    area.innerHTML = '<div class="empty-state">Chưa có học sinh nào.<br>Nhấn ⊕ để thêm học sinh.</div>';
    renderSummary(); return;
  }

  const student = data.students.find(s => s.id === activeStudentId);
  if (!student) { renderSummary(); return; }

  const card = document.createElement('div');
  card.className = 'calendar-card';
  card.innerHTML = `
    <div class="cal-header">
      <div class="student-name">${student.name}</div>
      <div class="price-tag">${fmt(student.pricePerHour)} / giờ</div>
    </div>
    <div class="day-labels">
      <span>CN</span><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span>
    </div>
  `;

  const grid = document.createElement('div');
  grid.className = 'cal-grid';

  const firstDay = new Date(curYear, curMonth, 1).getDay();
  const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement('div');
    empty.className = 'cal-day empty';
    grid.appendChild(empty);
  }

  let totalHours = 0, totalSessions = 0;

  for (let d = 1; d <= daysInMonth; d++) {
    const key = sessionKey(student.id, curYear, curMonth, d);
    const session = data.sessions[key];
    const isToday = (d === today.getDate() && curMonth === today.getMonth() && curYear === today.getFullYear());

    const cell = document.createElement('div');
    cell.className = 'cal-day' + (session ? ' marked' : '') + (isToday ? ' today' : '');
    cell.innerHTML = <span class="dn">${d}</span>;
    if (session) {
      cell.innerHTML += <span class="hrs">${session.hours}h</span>;
      totalHours += session.hours;
      totalSessions++;
    }
    if (isToday && !session) cell.innerHTML += <span class="dot-today"></span>;
    cell.onclick = () => openSessionModal(student.id, d, session);
    grid.appendChild(cell);
  }

  card.appendChild(grid);

  const totalRow = document.createElement('div');
  totalRow.className = 'cal-total';
  totalRow.innerHTML = <span>${totalSessions} buổi · ${totalHours}h</span><strong>${fmt(totalHours * student.pricePerHour)}</strong>;
  card.appendChild(totalRow);
  area.appendChild(card);
  renderSummary();
}

function renderSummary() {
  let totalSessions = 0, totalHours = 0, totalFee = 0;
  data.students.forEach(s => {
    const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const sess = data.sessions[sessionKey(s.id, curYear, curMonth, d)];
      if (sess) { totalSessions++; totalHours += sess.hours; totalFee += sess.hours * s.pricePerHour; }
    }
  });
  document.getElementById('sum-sessions').textContent = totalSessions;
  document.getElementById('sum-hours').textContent = totalHours + 'h';
  document.getElementById('sum-fee').textContent = fmt(totalFee);
}

function changeMonth(dir) {
  curMonth += dir;
  if (curMonth < 0) { curMonth = 11; curYear--; }
  if (curMonth > 11) { curMonth = 0; curYear++; }
  render();
}

function openSessionModal(studentId, day, existingSession) {
  modalStudentId = studentId;
  modalDay = day;
  selectedHour = existingSession ? existingSession.hours : null;
  const student = data.students.find(s => s.id === studentId);
  document.getElementById('modal-title').textContent = ${student.name} — Ngày ${day}/${curMonth+1}/${curYear};
  document.querySelectorAll('.hour-btn').forEach(b => b.classList.remove('sel'));
  document.getElementById('hour-input').value = existingSession ? existingSession.hours : '';
  if (selectedHour) document.querySelectorAll('.hour-btn').forEach(b => { if (parseFloat(b.textContent) === selectedHour) b.classList.add('sel'); });
  document.getElementById('session-overlay').classList.add('open');
}

function selectHour(h) {
  selectedHour = h;
  document.querySelectorAll('.hour-btn').forEach(b => b.classList.toggle('sel', parseFloat(b.textContent) === h));
  document.getElementById('hour-input').value = h;
}

function saveSession() {
  const inputVal = parseFloat(document.getElementById('hour-input').value);
  const hours = !isNaN(inputVal) && inputVal > 0 ? inputVal : selectedHour;
  if (!hours) { alert('Vui lòng chọn hoặc nhập số giờ.'); return; }
  data.sessions[sessionKey(modalStudentId, curYear, curMonth, modalDay)] = { hours };
  saveData(data); closeModal(); render();
}

function clearSession() {
  delete data.sessions[sessionKey(modalStudentId, curYear, curMonth, modalDay)];
  saveData(data); closeModal(); render();
}

function closeModal() { document.getElementById('session-overlay').classList.remove('open'); }

function openManage() {
  const list = document.getElementById('student-list-manage');
  list.innerHTML = '';
  if (data.students.length === 0) {
    list.innerHTML = '<div style="color:var(--muted);font-size:0.85rem;margin-bottom:10px">Chưa có học sinh</div>';
  } else {
    data.students.forEach(s => {
      const row = document.createElement('div');
      row.className = 'student-row';
      row.innerHTML = <span class="sname">${s.name}</span><span class="sprice">${s.pricePerHour.toLocaleString('vi-VN')}đ/h</span><button class="btn-del-student" onclick="deleteStudent('${s.id}')">✕</button>;
      list.appendChild(row);
    });
  }
  document.getElementById('manage-overlay').classList.add('open');
}

function closeManage() { document.getElementById('manage-overlay').classList.remove('open'); render(); }

function addStudent() {
  const name = document.getElementById('new-name').value.trim();
  const price = parseInt(document.getElementById('new-price').value);
  if (!name || isNaN(price) || price <= 0) { alert('Vui lòng nhập tên và giá hợp lệ.'); return; }
  const id = 's' + Date.now();
  data.students.push({ id, name, pricePerHour: price });
  if (!activeStudentId) activeStudentId = id;
  saveData(data);
  document.getElementById('new-name').value = '';
  document.getElementById('new-price').value = '';
  openManage();
}

function deleteStudent(id) {
  if (!confirm('Xóa học sinh này? Dữ liệu buổi học sẽ bị mất.')) return;
  data.students = data.students.filter(s => s.id !== id);
  Object.keys(data.sessions).forEach(k => { if (k.startsWith(id + '_')) delete data.sessions[k]; });
  if (activeStudentId === id) activeStudentId = data.students[0]?.id || null;
  saveData(data); openManage();
}

document.getElementById('session-overlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.getElementById('manage-overlay').addEventListener('click', function(e) { if (e.target === this) closeManage(); });

render();
</script>
</body>
</html>
